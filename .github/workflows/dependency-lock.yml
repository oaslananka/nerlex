name: Dependency lock

on:
  push:
    branches:
      - ci/lock-dev-dependencies

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: false

      - name: Resolve universal lock
        run: uv lock

      - name: Commit generated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already current"
            exit 0
          fi
          git commit -m "Lock CI dependencies"
          git push
