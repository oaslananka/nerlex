name: Dependency lock

on:
  push:
    branches:
      - ci/lock-dev-dependencies

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: false

      - name: Resolve universal lock
        run: uv lock

      - name: Upload lock
        uses: actions/upload-artifact@v7
        with:
          name: uv-lock-preview
          path: uv.lock
          if-no-files-found: error
