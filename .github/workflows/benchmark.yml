name: Reference inference benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
      - "src/nerlex/compiler.py"
      - "src/nerlex/calibration.py"
      - "src/nerlex/runtime.py"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff benchmark harness
        run: ruff check benchmarks

      - name: Run reference benchmark
        run: python benchmarks/inference.py --output benchmark.json

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: reference-inference-benchmark
          path: benchmark.json
          if-no-files-found: error
