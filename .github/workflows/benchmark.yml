name: Reference inference benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
      - "src/nerlex/compiler.py"
      - "src/nerlex/calibration.py"
      - "src/nerlex/runtime.py"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned benchmark dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r benchmarks/requirements.txt

      - name: Ruff benchmark harness
        run: ruff check benchmarks tests/test_benchmark_harness.py

      - name: Run reference benchmark
        run: python benchmarks/inference.py

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: reference-inference-benchmark
          path: benchmark.json
          if-no-files-found: error
