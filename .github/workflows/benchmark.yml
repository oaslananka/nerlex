name: Reference inference benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/nerlex/compiler.py"
      - "src/nerlex/calibration.py"
      - "src/nerlex/runtime.py"

permissions:
  contents: read

# Manual runs stay independent because non-PR events use unique run IDs.
# Only a newer run from the same PR supersedes an earlier benchmark run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      UV_PYTHON: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: false

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev --no-install-project --no-build

      - name: Ruff benchmark harness
        run: uv run --no-sync --no-build ruff check benchmarks tests/test_benchmark_harness.py

      - name: Run reference benchmark
        run: uv run --no-sync --no-build python benchmarks/inference.py

      - name: Upload benchmark result
        uses: actions/upload-artifact@v7
        with:
          name: reference-inference-benchmark
          path: benchmark.json
          if-no-files-found: error
