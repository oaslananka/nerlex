name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# PR runs share a stable group; push runs use unique run IDs and are never superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      PYTHONPATH: src
      MYPYPATH: src
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: false

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev --no-install-project --no-build

      - name: Ruff
        run: uv run --no-sync --no-build ruff check src tests tools

      - name: Mypy
        run: uv run --no-sync --no-build mypy src

      - name: Pytest
        run: uv run --no-sync --no-build pytest -q

      - name: Build
        run: uv run --no-sync --no-build python -m build

      - name: Check built distributions
        run: uv run --no-sync --no-build python tools/check_dist.py
